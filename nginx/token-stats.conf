upstream token_stats_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Local reverse proxy for token-stats dashboard.
# Handles blue-green upstream switching between ports 3000/3001.
# Exposed to ECS via SSH reverse tunnel: ECS:3002 → localhost:80
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost;

    access_log /var/log/nginx/token-stats-access.log;
    error_log /var/log/nginx/token-stats-error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
    gzip_min_length 1000;

    # Strip /token-stats/ prefix and forward to backend
    location /token-stats/ {
        proxy_pass http://token_stats_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
