# token-stats — ECS nginx location include
# Place this in /etc/nginx/token-stats-locations.inc (or include from your main server block)
#
# The upstream is the SSH reverse tunnel endpoint on ECS localhost:3002,
# which forwards to WSL2 local nginx (port 80) where blue-green switching happens.

location /token-stats/ {
    proxy_pass http://127.0.0.1:3002/token-stats/;
    proxy_http_version 1.1;
    # Host must be "localhost" to match local nginx server_name;
    # $host would be qiantangai.com, which local nginx doesn't serve.
    proxy_set_header Host localhost;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
}
