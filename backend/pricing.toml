# Token pricing configuration
# 汇率：1 USD = ? CNY（人民币）
usd_to_cny = 6.7894
rate_date = "2026-07-31"

# 分段汇率：按记录时间选择“最近生效”的一段（语义与模型价格 effective_from 一致）
# 兜底段（无 effective_from）：早于 2026-07-31 的记录沿用原单一汇率 6.82
# 之后由 scripts/update-exchange-rate.sh 每 2 周追加一段
[[usd_to_cny_segments]]
rate = 6.82

[[usd_to_cny_segments]]
effective_from = "2026-07-31"
rate = 6.7894

# 特殊计费规则（直接以人民币计价）
[special]
# 讯飞订阅：199 元 / 90000 次调用
xunfei_per_call = 0.002211111111

# CodeBuddy：国内版连续包月活动价 70 元 / 4000 credits（0.0175 元/credit，直接人民币计价，不经过汇率）。
# 这是历史基准价：早于下面所有分段的记录沿用该值。
codebuddy_cny_per_credit = 0.0175

# 套餐升级分段：2026-09-14 13:00 CST 起升级为 140 元 / 9000 credits，
# 每 credit 摊销价 140 / 9000 ≈ 0.0155556 元（比原 0.0175 低约 11%）。
# 语义与 opencode_model_segments 一致：取最近一个已生效的 effective_from；
# 早于首个分段的记录仍按上面的基准价计费。
codebuddy_credit_segments = [
    { effective_from = "2026-09-14T13:00:00+08:00", cny_per_credit = 0.015555555555555556 },
]

# Kimi legacy flat rate (kept only for compatibility; no longer used)
kimi_per_token = 0.000000071071429

# Kimi 订阅：实际成本 = 对应模型 API 原价 ÷ 此倍率；前端可调整并持久化。
kimi_subscription_multiplier = 20.0

# Kimi API 原价（CNY / 1M tokens）；cache write 免费。
kimi_api_models = [
    { name = "kimi-k3", input = 20.0, cache_read = 2.0, output = 100.0 },
    { name = "kimi-k2.6", input = 6.5, cache_read = 1.1, output = 27.0 },
    { name = "kimi-k2.7", input = 6.5, cache_read = 1.3, output = 27.0 },
]

# Xiaomi MiMo TP：99 元套餐
# 实测：dashboard 672.26M tokens ≈ 套餐使用 84%
# per_token（dashboard 计数）= 99 × 84% / 672,260,000 ≈ 0.0000001237
xiaomi_mimo_tp_per_token = 0.0000001237

# OpenCode 折扣：官方 10 美金可用 60 美金额度，实际成本 = 原始 cost / 6
opencode_divisor = 6.0

# 模型级、按时间分段的额度覆盖。匹配到的记录使用该段 divisor，
# 未匹配的模型/时间回落到 opencode_divisor。
# 2026-08-18 00:00 UTC+8 起 DeepSeek v4 flash/pro 月额度 $60 → $30，
# 即 $10 买 $30 额度 → divisor = 3。此前记录仍按 /6 计。
opencode_model_segments = [
    { models = ["deepseek-v4-flash", "deepseek-v4-pro"], effective_from = "2026-08-18T00:00:00+08:00", divisor = 3.0 },
]

# Ainaba (AI奶爸) 折扣：按时间段分段
# 平台结算逻辑：充值 396 元 → 8000 元额度（倍率 8000/396 = 20.20202）
# API 按美元面值计费，平台以固定汇率 ainaba_platform_rate 折算人民币额度扣减
# 实际成本 = USD × 7.0 / divisor（元），恒定不随市场汇率变
# 5月25日22:30(UTC+8)之前：40倍（历史促销段）
# 5月25日22:30(UTC+8)之前→8月2日1:00：20.20202 倍（充值倍率）
# 8月2日1:00(UTC+8)起：1 美元 = 0.325 元 → divisor = 7.0 / 0.325 = 21.538461538
# 分段按 `before` 时间匹配：记录时间 < before 则使用该段 divisor
# 最后一段不加 `before` 作为兜底（当前费率）
ainaba_platform_rate = 7.0
ainaba_segments = [
    { before = "2025-05-25T22:30:00+08:00", divisor = 40.0 },
    { before = "2026-08-02T01:00:00+08:00", divisor = 20.20202 },
    { divisor = 21.538461538 },
]

# Meituan LongCat：10 元 / 5000 万 Token（资源包计费）
# 只有非缓存 input + output 计费，cache 命中免费
# per_token = 10 / 50_000_000 = 0.0000002
meituan_per_token = 0.0000002

# Ollama Cloud empirical pricing（基于经验数据）
# Pro 订阅 $20/月，38M token = 13% 周配额
# 周配额 = 38M / 0.13 ≈ 292.3M tokens
# 月配额 = 292.3M × 52/12 ≈ 1.27B tokens
# 每百万token成本 = ¥135.79 / 1266.7 ≈ ¥0.1072
ollama_cloud_empirical_per_token = 0.0000001072
ollama_cloud_empirical_weekly_quota = 292307692

# Model-specific empirical multipliers relative to the glm-5.2 baseline.
# Unlisted Ollama models keep the baseline multiplier of 1.0.
# glm-5.3-flash: 5h Session 配额多点实测（token/pct）：
# 3.39M/3.0%=113.0M、3.67M/3.2%=114.7M、4.11M/3.7%=111.1M、4.23M/3.9%=108.5M
# 均值 ≈ 111.8M（±3%，全在 0.1% 显示粒度舍入误差内，稳定）
# 周配额 = 5 窗口 × 111.8M ≈ 559M；月 ≈ 2,423M；¥135.79 / 2,423M ≈ ¥0.0560/M
# 倍率 = 0.0560 / 0.1072 ≈ 0.523；交叉验证：glm-5.2 每窗口 58.46M → 58.46/111.8 = 0.523 ✓
ollama_cloud_model_multipliers = { "glm-5.2" = 1.0, "glm-5.3-flash" = 0.523, "deepseek-v4-flash" = 0.2, "deepseek-v4-flash:0731" = 0.2, "deepseek-v4-flash:0731-cloud" = 0.2, "deepseek-v4.1-flash" = 0.2 }

# FreeModel 折扣：1 USD 面值 = 0.1 CNY 实际成本，divisor = 6.7894 / 0.1 = 67.894
freemodel_divisor = 67.894

# CommandCode 订阅折扣：实际成本 = 列出价格 / 9.95
# （当前套餐已无 4x 用量倍率，2026-08-30 起按 9.95 折算）
commandcode_divisor = 9.95

# Fenno 订阅折扣：10 CNY 可买 150 USD 面值
# 先按 USD→CNY 换算，再除以折扣倍率：150 × 6.7894 / 10 = 101.841
fenno_divisor = 101.841

# Grok / Super Grok 订阅折扣：50 CNY 购买 3 个月配额（≈$1950 API 面值）
# 官方提供 $150/周 原始额度，3 个月 ≈ 13 周 × $150 = $1,950
# 实际成本 = API 计算价格（CNY）÷ grok_divisor
# 默认：$1,950 × 6.7894 / 50 = 264.7866
grok_divisor = 264.7866

# ── StepFun StepPlan 编码套餐（source=stepfun-proxy / dim 的 step-plan、stepfun 通道）──
# 套餐 ¥99 提供 ¥1600 的 API 额度，额度按 StepFun 官方列表价扣减
# （step-5-preview：输入 7 / 缓存命中 0.35 / 输出 20 元每 1M token）。
# 所以实付 = 列表价 × (99 / 1600) = 列表价 ÷ stepfun_plan_divisor
#          = 输入 0.433125 / 缓存命中 0.021656 / 输出 1.2375 元每 1M token。
# 列表价登记在下面的 [[model]] step-5-preview（CNY，不经汇率换算），
# 折扣只体现在这个倍率上——换套餐时只改这里。
# 注意：step-plan-intl（api.stepfun.ai）是美元计价的另一套端点，不走该倍率。
stepfun_plan_divisor = 16.16161616161616

# ── ZCode / BigModel GLM Coding Plan 计费（source=zcode, provider=bigmodel）──
# 官方积分公式（docs.bigmodel.cn/cn/coding-plan/overview）：
#   积分 =（输入 × Input系数 + 缓存命中 × Cached系数 + 输出 × Output系数）/ 10000
#   GLM-5.3-Flash: 2.3 / 0.56 / 8；GLM-5.3: 6.9 / 1.7 / 24
# 高峰时段（周一至周五 14:00–18:00 CST）按 1× 消耗，其余时段按 50% 抵扣；
# 夜间畅用活动（2026-09-03 ~ 10-07，官方把结束日从 09-20 延到 10-07；每日 23:00–09:00 CST，
# ZCode 端）消耗为 0，且仅限 Flash（官方活动为 GLM-5.3-Flash × ZCode 专属，
# zcode_night_free_models）；GLM-5.3 夜间不在活动范围，照常按高峰/波谷因子扣积分。
# 注意：实际免扣在 09-21 断档一天（09-20 结束、09-22 恢复），但官方公告口径是 9/3~10/7
# 连续，且该日无 flash 记录 → 刻意按单段连续窗口建模，不要再为这一天加空档。
# 注意：日期边界按**当晚起始日**判定——00:00–09:00 那半段属于前一天那一晚（跨午夜），
# 所以末日 10-07 的免扣一直延续到 **10-08 09:00 CST** 才结束，10-08 09:00 起恢复波谷 0.5×。
# （平台实测 10-08 00:00–09:00 仍 free：配额接口 5h 窗口计数器为 0。）
# 注意：活动自 2026-09-13 06:15 CST 起才实际生效——此前用的旧版 ZCode 客户端
# 不享受免扣，服务端照常扣积分，该时刻之前落在窗口内的记录按正常波谷 0.5× 计费
# （zcode_night_free_effective_from）。
# 实际成本 = 官方积分公式算出的积分 × 高峰因子 × zcode_cny_per_credit。
#
# zcode_cny_per_credit 按实付分摊（2026-09-12 实付 ¥188.04 买 3 个月）：
#   3 个月 ≈ 13 周 × 周额度 10000 积分 = 130,000 积分
#   每积分 = 188.04 / 130000 ≈ ¥0.00144646
# 含义：一周用满 10000 积分 = ¥14.46；一个月用满 ≈ ¥62.68 = 月均实付。
# 注意：官方列表价口径（×0.5312）高估约 3.7 倍，已废弃——套餐额度价值远超实付。
zcode_cny_per_credit = 0.0014464615384615384
zcode_credit_rates = { "glm-5.3-flash" = [2.3, 0.56, 8.0], "glm-5.3" = [6.9, 1.7, 24.0] }
zcode_peak_hours_cst = [[14, 18]]
zcode_off_peak_factor = 0.5
zcode_night_free_hours_cst = [[23, 24], [0, 9]]
zcode_night_free_models = ["glm-5.3-flash"]
zcode_night_free_from = "2026-09-03"
zcode_night_free_until = "2026-10-07"
zcode_night_free_effective_from = "2026-09-13T06:15:00+08:00"

# ── ZAI (api.zairouter.com) 计费 ───────────────────────────────────────────
# ZAI 是 Claude Code 的中转站：充值人民币、按 **1 元 = 1 美元额度** 到账
# （订单实测：amount=10000 分 → credit_amount 100.0）。
#
# 它**不公布价目表**，且实收费率不是官方价的统一倍数 —— 例如 claude-fable-5-1
# 输入按官方 2.5× 而输出按 2×，缓存命中/ 缓存写又各有折扣。因此下面直接登记
# **平台实收费率**（USD / 1M），而不是官方价 + 倍率。
#
# 数据来源：把平台账本（`dashboard/live` 的 credit_used 增量与逐模型日账）与
# 请求 usage 对齐后反推（2026-09-15，受控探针覆盖各 token 规模；并用当天 108 条
# 真实 claude-fable-5-1 记录交叉验证：按此表回算与平台记账逐条吻合）。
# 已确认无长上下文分档（273K 输入仍为同一费率）与峰谷差异。
#
# 注：claude-haiku-4-5 在该订阅下不可用（平台返回 "The long context beta is not
# yet available for this subscription"），故未登记。
#
# 成本 = 实收费率 × zai_rate_cny_per_usd。
zai_rate_cny_per_usd = 1.0

# ── Qoder（qodercli / Qoder Desktop）计费 ──────────────────────────────────
