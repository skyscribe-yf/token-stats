# ═══════════════════════════════════════════════════════════════════════════
# DimAgent 平台全站闲时窗口（仅 source="dim" 生效）
#
# 节假日平台把**整个模型目录**按闲时计费，因此这不是某个模型的 peak_hours_utc，
# 而是一条覆盖全表的开关：窗口内所有 `dim` 记录一律按基础价，`peak_*` 双倍不生效。
#
# ── 2026 国庆（10-01 至 10-07 共 7 天，国办发明电〔2025〕7 号）──────────────
# 平台提前到 **09-30 11:21 CST** 切换，账本实测（不是公告口径）：
#   2026-09-30 11:00 CST 小时桶里 deepseek-v4.1-flash 的 228 条记录**前 62 条
#   按忙时 2×、之后按闲时 1×**。逐条累加只有「11:20:54 之后 / 11:21:43 之前切换」
#   这一个解，残差 1.9 毫积分（0.0007%）；下一个候选解残差就跳到 481 毫积分。
#   同桶的 12:00 / 13:00 / 14:00 及 10-01 各桶 `base_amount_minor` 全部按闲时
#   闭合（比值 0.99997~1.00004），`final/base` 恒为 entitlement 0.65。
#   ⇒ cutoff 取 **2026-09-30T11:21:00+08:00**（落在两条记录之间的空档里，
#     取整到分钟，与 mimo-v2.6-flash 那次「cutoff 取流量空档内的整点」同一手法）。
#   ⚠️ 09-30 11:21–12:00 这一段落在 busy 窗口内，是**唯一**被这次切换改写的
#     历史记录；12:00 以后本来就不忙，无差异。
#
# `to = "2026-10-08"` = 国庆法定假期（10-01~10-07）结束、次日起恢复忙时双倍。
# **故意写死这个上界**：留空会让窗口一直生效，之后每个忙时段都少算一半且
# 不报错。若平台延长假期（历史上可能），改这个 `to` 即可，然后跑
# `./scripts/verify-dim-billing.py --interval hourly` 确认对应桶仍是 1×；
# 恢复后同样跑一次，确认 10-08 之后的桶回到 2×。
# ═══════════════════════════════════════════════════════════════════════════
[[special.dim_offpeak_windows]]
from = "2026-09-30T11:21:00+08:00"
to = "2026-10-08"

# ═══════════════════════════════════════════════════════════════════════════
# ZCode/BigModel 双节「取消高峰期」窗口（仅 source="zcode" / "glm-acp"）
#
# 官方公告：2026-09-25 ~ 10-07，套餐**全天按非高峰倍率**（0.5×）消耗额度，
# 平时属于高峰的「周一至周五 14:00–18:00 CST」不再按 1× 计。
# 窗口内把 `zcode_peak_hours_cst` 整体抑制掉（与 dim_offpeak_windows 同一套
# 半开区间判定，见 `in_offpeak_window`）。
#
# `to` 故意写死不留空：留空会让窗口一直生效，之后每个忙时段少算一半且不报错。
# 来源：官方文档 + BlockBeats/iGetoken 2026-09-22 快讯（「9 月 25 日至 10 月 7 日
# 取消高峰期，全天按非高峰倍率扣额度」）。活动若有延期，改这个 `to` 即可。
# 历史影响：本地在此之前把 09-25~10-07 的工作日 14–18 点按 1× 算，高估一倍。
# ═══════════════════════════════════════════════════════════════════════════
[[special.zcode_peak_suspend_windows]]
from = "2026-09-25"
to = "2026-10-08"

