# Token pricing configuration
# 汇率：1 USD = ? CNY（人民币）
usd_to_cny = 6.82
rate_date = "2026-05-20"

# 特殊计费规则（直接以人民币计价）
[special]
# 讯飞订阅：199 元 / 90000 次调用
xunfei_per_call = 0.002211111111

# Kimi legacy flat rate (kept only for compatibility; no longer used)
kimi_per_token = 0.000000071071429

# Kimi 订阅：实际成本 = 对应模型 API 原价 ÷ 此倍率；前端可调整并持久化。
kimi_subscription_multiplier = 20.0

# Kimi API 原价（CNY / 1M tokens）；cache write 免费。
kimi_api_models = [
    { name = "kimi-k3", input = 20.0, cache_read = 2.0, output = 100.0 },
    { name = "kimi-k2.6", input = 6.5, cache_read = 1.1, output = 27.0 },
    { name = "kimi-k2.7", input = 6.5, cache_read = 1.3, output = 27.0 },
]

# Xiaomi MiMo TP：99 元套餐
# 实测：dashboard 672.26M tokens ≈ 套餐使用 84%
# per_token（dashboard 计数）= 99 × 84% / 672,260,000 ≈ 0.0000001237
xiaomi_mimo_tp_per_token = 0.0000001237

# OpenCode 折扣：官方 10 美金可用 60 美金额度，实际成本 = 原始 cost / 6
opencode_divisor = 6.0

# Ainaba (AI奶爸) 折扣：按时间段分段
# 5月25日22:30(UTC+8)之前：40倍
# 5月25日22:30(UTC+8)之后：20倍
# 分段按 `before` 时间匹配：记录时间 < before 则使用该段 divisor
# 最后一段不加 `before` 作为兜底（当前费率）
ainaba_segments = [
    { before = "2025-05-25T22:30:00+08:00", divisor = 40.0 },
    { divisor = 20.0 },
]

# Meituan LongCat：10 元 / 5000 万 Token（资源包计费）
# 只有非缓存 input + output 计费，cache 命中免费
# per_token = 10 / 50_000_000 = 0.0000002
meituan_per_token = 0.0000002

# Ollama Cloud empirical pricing（基于经验数据）
# Pro 订阅 $20/月，38M token = 13% 周配额
# 周配额 = 38M / 0.13 ≈ 292.3M tokens
# 月配额 = 292.3M × 52/12 ≈ 1.27B tokens
# 每百万token成本 = ¥136.4 / 1266.7 ≈ ¥0.1077
ollama_cloud_empirical_per_token = 0.0000001077
ollama_cloud_empirical_weekly_quota = 292307692

# FreeModel 折扣：1 USD 面值 = 0.1 CNY 实际成本，divisor = 6.82 / 0.1 = 68.2
freemodel_divisor = 68.2

# CommandCode 订阅折扣：实际成本 = 列出价格 / 10
commandcode_divisor = 10.0

# Fenno 订阅折扣：10 CNY 可买 150 USD 面值
# 先按 USD→CNY 换算，再除以折扣倍率：150 × 6.82 / 10 = 102.3
fenno_divisor = 102.3

# Grok / Super Grok 订阅折扣：50 CNY 购买 3 个月配额（≈$1950 API 面值）
# 官方提供 $150/周 原始额度，3 个月 ≈ 13 周 × $150 = $1,950
# 实际成本 = API 计算价格（CNY）÷ grok_divisor
# 默认：$1,950 × 6.82 / 50 = 266
grok_divisor = 266.0

# ── 讯飞波谷计费配置（2026年6月18日上线） ──────────────────────────────
# 分时段差异化计量，错峰使用即可享受优惠费率：
#
#   高峰时段：工作日 08:00–22:00 (UTC+8)，计费系数 1.0
#   波谷时段：夜间 22:00–次日08:00、周末全天、节假日全天，计费系数 0.8
#
# 波谷系数对流控次数的影响：
#   以 5 小时流控 6000 次、波谷系数 0.8 为例，折算后实际 5 小时流控量为 7500 次；
#   其他流控维度均按该逻辑换算。
#
# 计算公式：实际单价 = xunfei_per_call × coefficient
#   高峰：0.002211 × 1.0 = 0.002211 元/次
#   波谷：0.002211 × 0.8 = 0.001769 元/次
[special.xunfei_off_peak]
coefficient = 0.8
effective_from = "2026-06-18"
peak_hours = [8, 22]
# 中国法定节假日（UTC+8 日期，格式 YYYY-MM-DD）
# 需每年根据国务院公告更新（通常在前一年 11-12 月发布）
holidays = [
    # 2026 年元旦
    "2026-01-01", "2026-01-02", "2026-01-03",
    # 2026 年春节
    "2026-02-15", "2026-02-16", "2026-02-17", "2026-02-18", "2026-02-19", "2026-02-20", "2026-02-21",
    # 2026 年清明节
    "2026-04-04", "2026-04-05", "2026-04-06",
    # 2026 年劳动节
    "2026-05-01", "2026-05-02", "2026-05-03", "2026-05-04", "2026-05-05",
    # 2026 年端午节
    "2026-06-19", "2026-06-20", "2026-06-21",
    # 2026 年中秋节 + 国庆节
    "2026-10-01", "2026-10-02", "2026-10-03", "2026-10-04", "2026-10-05", "2026-10-06", "2026-10-07",
]

