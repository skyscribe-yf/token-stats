# 2026-10-01 上线。价目卡 6 个套餐（8101/8102/08_25/8103/8104/8104_copy）一致地写
# input 435 / output 870 / cache_read 3.6 积分/M，**且 6 个字段顺序与结算口径一致**
# ——与 `mimo-v2.6-flash` 那个反序的坑不同，这里照抄价目卡即可（仍已对账，见下）。
# 换算 × 70/11000（见本节开头；1 积分 = ¥0.006363636）：
#   435 → 2.768182、870 → 5.536364、3.6 → 0.022909 CNY/M。
# 无 `windows` / `time_periods` ⇒ 不设 `peak_hours_utc`（价目卡与账本都没有忙时双倍）。
# entitlement rate = **1.0**：`dim usage --json` 的 `model_access[]` 里该模型只有
# `{"model":"mimo-v2.6-pro","route_pool":"open beta"}`，**无 rate / rate_windows**
# ⇒ dim_entitlement 回落 1.0，与账本 `base == final` 一致。
#
# 对账（`/api/user/daily-stats`，`interval=hourly`）——2026-10-01 14:00 CST 小时桶：
# 该桶混了两个模型，故用同桶里费率已验证的 deepseek-v4.1-flash 扣掉它的部分再解 mimo。
# 关键前提：先在本地记录里找到与账本 token 口径**完全吻合**的前缀，再逐项对账
# （账本 `prompt_tokens` 含 cache，对应我们已减去 cache 的 `input_tokens`）：
#   本地前 311 条 = deepseek 306 条（in 551151 / out 204762 / cache 28077440）
#                  + mimo     5 条（in  43075 / out   1777 / cache  154624）
#   该前缀的 token 与账本桶**逐项精确相等**（prompt 28826290 = 594226 + 28232064、
#   completion 206539、cache 28232064）→ 这 311 条就是账本实际计费的请求集合。
#   注意 `request_count` 是 316（比 token 口径多 5），**别拿 316 做前缀匹配**，
#   那是尚未落账的在途请求，照它算会对不上（verify-dim-billing.py 的前缀法在这里
#   会误报 1.7845x）。
#   按目录原价累加：deepseek 265589.328 + mimo 20840.261 = **286429.589** 毫积分
#     vs 账本 `base_amount_minor` 286432 → **0.999992x**（残差 2.4 毫积分）
#   按 entitlement 折后：deepseek ×0.65 = 172633.063 + mimo ×1.0 = 20840.261
#     = **193473.325** 毫积分 vs 账本 `final_amount_minor` 193477 → **0.999981x**
#   base 与 final 双双闭合 ⇒ mimo 既是目录原价、又没有折扣、也没有忙时双倍。
# ⚠️ 顺带发现（**与本条无关，未改动**，留待单独处理）：同桶 deepseek-v4.1-flash 在
# CST 14:00 这个"忙时"桶里账本只按**非忙时**价计费，而本表给它配了
# `peak_hours_utc = [[1,4],[6,10]]`（含 UTC 06–10）。逐桶复核显示平台并不一致：
# 09-12/13/15/24 的 14–18 点确实按忙时 2× 收，09-20、09-30 的同样时段却不翻倍。
# 即忙时规则被平台改过/按周波动，而本表的 peak 窗口是 09-10 的单日结论——
# 定价已静默偏差，**不要**在改 mimo 这条时顺手改它（会重写历史）。
# 来源：GET https://dimagent.cn/api/public/website/plans?line=dimcode
# 改这段前先跑 `./scripts/verify-dim-billing.py --interval hourly`（当天即可验证）。
