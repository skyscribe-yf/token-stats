# Token pricing configuration
# 汇率：1 USD = ? CNY（人民币）
usd_to_cny = 6.7894
rate_date = "2026-07-31"

# 分段汇率：按记录时间选择“最近生效”的一段（语义与模型价格 effective_from 一致）
# 兜底段（无 effective_from）：早于 2026-07-31 的记录沿用原单一汇率 6.82
# 之后由 scripts/update-exchange-rate.sh 每 2 周追加一段
[[usd_to_cny_segments]]
rate = 6.82

[[usd_to_cny_segments]]
effective_from = "2026-07-31"
rate = 6.7894

# 特殊计费规则（直接以人民币计价）
[special]
# 讯飞订阅：199 元 / 90000 次调用
xunfei_per_call = 0.002211111111

# CodeBuddy：国内版连续包月活动价 70 元 / 4000 credits（0.0175 元/credit，直接人民币计价，不经过汇率）
codebuddy_cny_per_credit = 0.0175

# Kimi legacy flat rate (kept only for compatibility; no longer used)
kimi_per_token = 0.000000071071429

# Kimi 订阅：实际成本 = 对应模型 API 原价 ÷ 此倍率；前端可调整并持久化。
kimi_subscription_multiplier = 20.0

# Kimi API 原价（CNY / 1M tokens）；cache write 免费。
kimi_api_models = [
    { name = "kimi-k3", input = 20.0, cache_read = 2.0, output = 100.0 },
    { name = "kimi-k2.6", input = 6.5, cache_read = 1.1, output = 27.0 },
    { name = "kimi-k2.7", input = 6.5, cache_read = 1.3, output = 27.0 },
]

# Xiaomi MiMo TP：99 元套餐
# 实测：dashboard 672.26M tokens ≈ 套餐使用 84%
# per_token（dashboard 计数）= 99 × 84% / 672,260,000 ≈ 0.0000001237
xiaomi_mimo_tp_per_token = 0.0000001237

# OpenCode 折扣：官方 10 美金可用 60 美金额度，实际成本 = 原始 cost / 6
opencode_divisor = 6.0

# 模型级、按时间分段的额度覆盖。匹配到的记录使用该段 divisor，
# 未匹配的模型/时间回落到 opencode_divisor。
# 2026-08-18 00:00 UTC+8 起 DeepSeek v4 flash/pro 月额度 $60 → $30，
# 即 $10 买 $30 额度 → divisor = 3。此前记录仍按 /6 计。
opencode_model_segments = [
    { models = ["deepseek-v4-flash", "deepseek-v4-pro"], effective_from = "2026-08-18T00:00:00+08:00", divisor = 3.0 },
]

# Ainaba (AI奶爸) 折扣：按时间段分段
# 平台结算逻辑：充值 396 元 → 8000 元额度（倍率 8000/396 = 20.20202）
# API 按美元面值计费，平台以固定汇率 ainaba_platform_rate 折算人民币额度扣减
# 实际成本 = USD × 7.0 / divisor（元），恒定不随市场汇率变
# 5月25日22:30(UTC+8)之前：40倍（历史促销段）
# 5月25日22:30(UTC+8)之前→8月2日1:00：20.20202 倍（充值倍率）
# 8月2日1:00(UTC+8)起：1 美元 = 0.325 元 → divisor = 7.0 / 0.325 = 21.538461538
# 分段按 `before` 时间匹配：记录时间 < before 则使用该段 divisor
# 最后一段不加 `before` 作为兜底（当前费率）
ainaba_platform_rate = 7.0
ainaba_segments = [
    { before = "2025-05-25T22:30:00+08:00", divisor = 40.0 },
    { before = "2026-08-02T01:00:00+08:00", divisor = 20.20202 },
    { divisor = 21.538461538 },
]

# Meituan LongCat：10 元 / 5000 万 Token（资源包计费）
# 只有非缓存 input + output 计费，cache 命中免费
# per_token = 10 / 50_000_000 = 0.0000002
meituan_per_token = 0.0000002

# Ollama Cloud empirical pricing（基于经验数据）
# Pro 订阅 $20/月，38M token = 13% 周配额
# 周配额 = 38M / 0.13 ≈ 292.3M tokens
# 月配额 = 292.3M × 52/12 ≈ 1.27B tokens
# 每百万token成本 = ¥135.79 / 1266.7 ≈ ¥0.1072
ollama_cloud_empirical_per_token = 0.0000001072
ollama_cloud_empirical_weekly_quota = 292307692

# Model-specific empirical multipliers relative to the glm-5.2 baseline.
# Unlisted Ollama models keep the baseline multiplier of 1.0.
# glm-5.3-flash: 5h Session 配额多点实测（token/pct）：
# 3.39M/3.0%=113.0M、3.67M/3.2%=114.7M、4.11M/3.7%=111.1M、4.23M/3.9%=108.5M
# 均值 ≈ 111.8M（±3%，全在 0.1% 显示粒度舍入误差内，稳定）
# 周配额 = 5 窗口 × 111.8M ≈ 559M；月 ≈ 2,423M；¥135.79 / 2,423M ≈ ¥0.0560/M
# 倍率 = 0.0560 / 0.1072 ≈ 0.523；交叉验证：glm-5.2 每窗口 58.46M → 58.46/111.8 = 0.523 ✓
ollama_cloud_model_multipliers = { "glm-5.2" = 1.0, "glm-5.3-flash" = 0.523, "deepseek-v4-flash" = 0.2, "deepseek-v4-flash:0731" = 0.2, "deepseek-v4-flash:0731-cloud" = 0.2 }

# FreeModel 折扣：1 USD 面值 = 0.1 CNY 实际成本，divisor = 6.7894 / 0.1 = 67.894
freemodel_divisor = 67.894

# CommandCode 订阅折扣：实际成本 = 列出价格 / 9.95
# （当前套餐已无 4x 用量倍率，2026-08-30 起按 9.95 折算）
commandcode_divisor = 9.95

# Fenno 订阅折扣：10 CNY 可买 150 USD 面值
# 先按 USD→CNY 换算，再除以折扣倍率：150 × 6.7894 / 10 = 101.841
fenno_divisor = 101.841

# Grok / Super Grok 订阅折扣：50 CNY 购买 3 个月配额（≈$1950 API 面值）
# 官方提供 $150/周 原始额度，3 个月 ≈ 13 周 × $150 = $1,950
# 实际成本 = API 计算价格（CNY）÷ grok_divisor
# 默认：$1,950 × 6.7894 / 50 = 264.7866
grok_divisor = 264.7866

# ── 讯飞波谷计费配置（2026年6月18日上线） ──────────────────────────────
# 分时段差异化计量，错峰使用即可享受优惠费率：
#
#   高峰时段：工作日 08:00–22:00 (UTC+8)，计费系数 1.0
#   波谷时段：夜间 22:00–次日08:00、周末全天、节假日全天，计费系数 0.8
#
# 波谷系数对流控次数的影响：
#   以 5 小时流控 6000 次、波谷系数 0.8 为例，折算后实际 5 小时流控量为 7500 次；
#   其他流控维度均按该逻辑换算。
#
# 计算公式：实际单价 = xunfei_per_call × coefficient
#   高峰：0.002211 × 1.0 = 0.002211 元/次
#   波谷：0.002211 × 0.8 = 0.001769 元/次
[special.xunfei_off_peak]
coefficient = 0.8
effective_from = "2026-06-18"
peak_hours = [8, 22]
